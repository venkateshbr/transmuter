map_hash_bucket_size 128;

map $http_x_forwarded_proto $transmuter_forwarded_proto {
  default $scheme;
  "https" https;
}

map $uri $transmuter_access_loggable {
  default 1;
  "/api/meeting-integrations/microsoft/oauth/callback" 0;
}

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;
  access_log /var/log/nginx/access.log combined if=$transmuter_access_loggable;

  gzip on;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

  location = /health {
    access_log off;
    add_header Content-Type text/plain;
    return 200 "ok\n";
  }

  location = /assets/runtime-config.js {
    add_header Cache-Control "no-store";
    try_files $uri =404;
  }

  location /api/ {
    proxy_pass http://api:8001/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $transmuter_forwarded_proto;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
